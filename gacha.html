@keyframes nebulaSpin{from{transform:scale(1.25) rotate(0)}to{transform:scale(1.25) rotate(360deg)}}
.bg-overlay{position:fixed; inset:0; z-index:1; background:radial-gradient(circle at 50% 45%, transparent 10%, rgba(10,14,23,.55) 55%, var(--surface-lowest) 100%);}
#stars{position:fixed; inset:0; z-index:2; pointer-events:none;}
.star{position:absolute; background:#fff; border-radius:50%; opacity:0;
  animation:twinkle var(--dur,6s) ease-in-out var(--delay,0s) infinite; box-shadow:0 0 4px #fff;}
@keyframes twinkle{0%,100%{opacity:0; transform:translate(0,0)}50%{opacity:var(--max,.6); transform:translate(var(--tx,0),var(--ty,0))}}

/* ===== 顶部栏（移动端优先：紧凑、居中、不挤占主视觉） ===== */
.topbar{
  flex:0 0 auto; position:relative; z-index:50;
  min-height:calc(2.8rem + env(safe-area-inset-top,0px));
  display:flex; align-items:center; justify-content:center;
  padding:env(safe-area-inset-top,0px) 3.6rem 0;
  background:linear-gradient(180deg, rgba(10,14,23,.9), rgba(10,14,23,.35) 80%, transparent);
  backdrop-filter:blur(14px);
}
.top-back,.top-act{
  width:2.2rem; height:2.2rem; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(38,42,52,.6); border:1px solid rgba(255,255,255,.1);
  color:var(--on-surface-variant); cursor:pointer; transition:.2s; backdrop-filter:blur(8px);
}
.top-back{position:absolute; left:.85rem; top:calc(env(safe-area-inset-top,0px) + .3rem);}
.top-actions{position:absolute; right:.85rem; top:calc(env(safe-area-inset-top,0px) + .3rem); display:flex; gap:.5rem;}
.top-back .material-symbols-outlined,.top-act .material-symbols-outlined{font-size:1.2rem;}
.top-back:hover,.top-act:hover{color:var(--primary); border-color:var(--primary);}
.top-title{font-family:'Noto Serif',serif; font-size:1rem; font-weight:700; color:var(--primary); letter-spacing:.2em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* 右侧悬浮按钮（图鉴/统计）已移入顶部栏 */


/* ===== 中央舞台（星云旋转 + 星星点点） ===== */
.stage{flex:1 1 auto; min-height:0; position:relative; z-index:3;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:.25rem .5rem; overflow:hidden;}
.nebula-core{position:absolute; top:48%; left:50%; width:min(155vw,640px); height:min(155vw,640px);
  transform:translate(-50%,-50%); border-radius:50%;
  background:radial-gradient(circle, rgba(233,196,0,.22), rgba(124,77,255,.16) 32%, transparent 62%);
  animation:coreSpin 70s linear infinite; filter:blur(12px); pointer-events:none;}
@keyframes coreSpin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.stage-rings{position:absolute; top:48%; left:50%; width:min(92vw,400px); height:min(92vw,400px);
  transform:translate(-50%,-50%); pointer-events:none;}
.stage-rings span{position:absolute; inset:0; border-radius:50%; border:1px solid rgba(233,196,0,.12);}
.stage-rings span:nth-child(2){inset:14%; border-color:rgba(215,186,255,.10); animation:ringSpin 26s linear infinite;}
.stage-rings span:nth-child(3){inset:28%; border-color:rgba(130,177,255,.08); animation:ringSpin 18s linear infinite reverse;}
@keyframes ringSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.stage-center{position:relative; z-index:4; display:flex; flex-direction:column; align-items:center; gap:.7rem; text-align:center; padding:0 1rem; margin-top:-.5rem;}
.stage-orb{width:min(28vw,120px); height:min(28vw,120px); border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #fff7d6, rgba(233,196,0,.5) 45%, rgba(124,77,255,.35) 75%);
  box-shadow:0 0 48px rgba(233,196,0,.5), inset 0 0 26px rgba(255,255,255,.45);
  animation:pulseOrb 3.4s ease-in-out infinite;}
@keyframes pulseOrb{0%,100%{transform:scale(1); box-shadow:0 0 42px rgba(233,196,0,.45), inset 0 0 24px rgba(255,255,255,.4);}50%{transform:scale(1.08); box-shadow:0 0 68px rgba(233,196,0,.65), inset 0 0 34px rgba(255,255,255,.55);}}
.stage-title{font-family:'Noto Serif',serif; font-size:clamp(1rem,5vw,1.25rem); font-weight:700; color:var(--primary-fixed); letter-spacing:.28em; text-shadow:0 2px 10px rgba(0,0,0,.5);}
.stage-hint{font-size:clamp(.7rem,3.2vw,.82rem); color:var(--on-surface-variant); opacity:.82; letter-spacing:.08em;}

/* ===== 中下部信息条 + 底部抽卡控制 ===== */
.info-row{flex:0 0 auto; display:flex; gap:.6rem; justify-content:center; align-items:center; padding:0 1rem .55rem; z-index:5;}
.info-pill{display:flex; align-items:center; gap:.4rem; padding:.45rem .85rem; border-radius:999px;
  background:rgba(28,31,41,.7); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.08);
  font-size:clamp(.72rem,3.4vw,.82rem); color:var(--on-surface-variant); letter-spacing:.04em; box-shadow:0 6px 18px rgba(0,0,0,.35);}
.info-pill .material-symbols-outlined{font-size:clamp(1rem,4.2vw,1.15rem); color:var(--primary-fixed);}
.info-pill b{color:var(--primary-fixed); font-weight:700; font-family:'Space Grotesk',sans-serif;}
.controls{flex:0 0 auto; display:flex; flex-direction:column; align-items:stretch; gap:.7rem;
  padding:.8rem 1rem calc(.9rem + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg, rgba(10,14,23,.98), rgba(10,14,23,.62) 60%, transparent);
  z-index:30;}
.pull-btns{display:flex; gap:.7rem; width:100%; max-width:520px; margin:0 auto;}
.pull-btn{position:relative; overflow:hidden; flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15rem;
  border-radius:16px; cursor:pointer; border:1px solid rgba(153,144,119,.3);
  background:rgba(49,53,63,.7); backdrop-filter:blur(14px); transition:.25s; color:var(--on-surface);}
.pull-btn .lbl{font-family:'Noto Serif',serif; font-size:clamp(1.05rem,5vw,1.25rem); font-weight:700; letter-spacing:.2em;}
.pull-btn .cost{font-size:clamp(.58rem,2.8vw,.65rem); letter-spacing:.1em; text-transform:uppercase; color:var(--outline);}
.pull-btn.single:hover{color:var(--primary); border-color:var(--primary);}
.pull-btn.ten .lbl{font-size:clamp(1.15rem,5.4vw,1.35rem);}
.pull-btn.ten{color:var(--primary-fixed);
  background:rgba(233,196,0,.16); border-color:rgba(233,196,0,.55); box-shadow:0 0 32px rgba(233,196,0,.25);}
.pull-btn.ten:hover{border-color:var(--primary-fixed); box-shadow:0 0 50px rgba(233,196,0,.45);}
.pull-btn:disabled{opacity:.5; cursor:not-allowed;}
.pull-btn::after{content:''; position:absolute; inset:0; transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent); transition:.7s;}
.pull-btn:hover::after{transform:translateX(100%);}

/* ===== 结果层（可翻转卡牌） ===== */
.result-layer{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; flex-direction:column;}
.result-layer.active{display:flex;}
.result-backdrop{position:absolute; inset:0; background:rgba(10,14,23,.94); backdrop-filter:blur(20px); transition:background .8s;}
.result-backdrop.rarity-SR{background:radial-gradient(circle at 50% 45%, rgba(93,45,159,.35), rgba(10,14,23,.96) 70%);}
.result-backdrop.rarity-SSR{background:radial-gradient(circle at 50% 45%, rgba(147,0,10,.3), rgba(10,14,23,.96) 70%);}
.result-backdrop.rarity-UR{background:radial-gradient(circle at 50% 45%, rgba(112,93,0,.5), rgba(10,14,23,.95) 70%);}
.result-backdrop.rarity-METEOR{background:radial-gradient(circle at 50% 45%, rgba(0,229,255,.38), rgba(10,14,23,.96) 70%);}
.result-container{position:relative; z-index:2; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:1rem; max-width:1100px; padding:1rem;}
.result-grid{display:flex; flex-wrap:wrap; justify-content:center; gap:1rem;}
.result-skip{position:absolute; top:5.5rem; right:1.5rem; z-index:5; padding:.5rem 1.2rem; border-radius:999px;
  border:1px solid rgba(153,144,119,.3); background:rgba(38,42,52,.7); color:var(--on-surface-variant); font-size:.8rem; cursor:pointer; backdrop-filter:blur(10px);}
.result-skip:hover{color:var(--primary); border-color:var(--primary);}
.again-btn{position:relative; z-index:5; margin-top:1.5rem; display:flex; align-items:center; gap:.4rem;
  padding:.7rem 2rem; border-radius:999px; border:none; background:var(--primary-fixed); color:var(--on-primary);
  font-weight:700; font-size:.95rem; cursor:pointer; box-shadow:0 0 22px rgba(233,196,0,.3); transition:.2s;}
.again-btn:hover{transform:scale(1.05);}

/* 翻转卡 */
.flip-card{perspective:1200px; width:clamp(120px,26vw,150px); height:clamp(170px,38vw,220px);}
.flip-card.big{width:clamp(220px,68vw,320px); height:clamp(320px,92vw,460px);}
.fc-inner{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.4,0,.2,1);}
.flip-card.flipped .fc-inner{transform:rotateY(180deg);}
.fc-back,.fc-front{position:absolute; inset:0; border-radius:18px; backface-visibility:hidden; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1rem; border:1px solid var(--glass-border);}
.fc-back{background:var(--surface-highest);}
.fc-back .material-symbols-outlined{font-size:2.4rem; color:var(--outline); opacity:.5;}
.fc-front{transform:rotateY(180deg); color:#1a1a1a; text-align:center;}
.fc-rarity{font-size:.7rem; font-weight:700; letter-spacing:.15em; margin-bottom:.4rem;}
.fc-icon{width:clamp(48px,12vw,72px); height:clamp(48px,12vw,72px); display:flex; align-items:center; justify-content:center; margin-bottom:.5rem;}
.fc-icon .silhouette{width:100%; height:100%; fill:currentColor; filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));}
.fc-icon .z-sym{font-size:clamp(2rem,7vw,3rem); font-weight:700;}
.fc-name{font-family:'Noto Serif',serif; font-weight:700; font-size:clamp(.85rem,3.4vw,1.05rem); line-height:1.2;}
.fc-title{font-size:.62rem; opacity:.7; margin-top:.25rem;}
.fc-group{position:absolute; bottom:.6rem; font-size:.6rem; letter-spacing:.1em; opacity:.65;}

/* 稀有度卡面 */
.fc-front.rarity-N{background:linear-gradient(160deg,#fbfdff,#e2e8f0); color:#37474f;}
.fc-front.rarity-R{background:linear-gradient(160deg,#f5f7fa,#cfd8dc); color:#37474f;}
.fc-front.rarity-SR{background:linear-gradient(160deg,#7b3fbf,#4a148c); color:#fff; box-shadow:0 0 18px rgba(215,186,255,.4);}
.fc-front.rarity-SSR{background:linear-gradient(160deg,#ffd54f,#ff8f00); color:#3e2723; box-shadow:0 0 26px rgba(233,196,0,.5);}
.fc-front.rarity-UR{background:linear-gradient(135deg,#ff4081,#7c4dff,#18ffff,#ff4081); background-size:200% 200%; animation:urShift 4s linear infinite; color:#fff; box-shadow:0 0 40px rgba(255,215,0,.7);}
.fc-front.rarity-METEOR{background:linear-gradient(160deg,#00e5ff,#2979ff,#7c4dff); background-size:200% 200%; animation:urShift 5s linear infinite; color:#fff; box-shadow:0 0 34px rgba(0,229,255,.55);}
@keyframes urShift{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.fc-front.rarity-UR::before{content:''; position:absolute; inset:-40%; background:conic-gradient(from 0deg, transparent 0 340deg, rgba(255,255,255,.6) 360deg); mix-blend-mode:overlay; animation:ringSpin 3s linear infinite;}

/* 屏幕爆光 */
.burst{position:fixed; inset:0; z-index:99; pointer-events:none; opacity:0;}
.burst.sr{background:radial-gradient(circle at 50% 50%, rgba(215,186,255,.5), transparent 60%); animation:flash .9s ease-out;}
.burst.ssr{background:radial-gradient(circle at 50% 50%, rgba(255,215,0,.6), transparent 55%); animation:flash 1.1s ease-out;}
.burst.ur{background:radial-gradient(circle at 50% 50%, rgba(255,215,0,.8), transparent 50%); animation:flash 1.4s ease-out;}
.burst.meteor{background:radial-gradient(circle at 50% 50%, rgba(0,229,255,.75), transparent 52%); animation:flash 1.3s ease-out;}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.ur-burst{position:fixed; inset:0; z-index:98; pointer-events:none; display:none;
  background:radial-gradient(circle at 50% 45%, rgba(255,215,0,.35), transparent 60%);}
.ur-burst.active{display:block; animation:urPulse 1.6s ease-out;}
@keyframes urPulse{0%{opacity:0; transform:scale(.6)}50%{opacity:1}100%{opacity:0; transform:scale(1.4)}}

/* ===== 弹窗（图鉴/详情/统计） ===== */
.modal,.detail-modal{position:fixed; inset:0; z-index:110; display:none; flex-direction:column; align-items:center; justify-content:center; padding:1.2rem;}
.modal.active,.detail-modal.active{display:flex;}
.modal::before,.detail-modal::before{content:''; position:absolute; inset:0; background:rgba(10,14,23,.85); backdrop-filter:blur(16px);}
.modal-card{position:relative; z-index:2; width:min(94vw,760px); max-height:86vh; display:flex; flex-direction:column;
  background:var(--surface-container); border:1px solid var(--glass-border); border-radius:20px; overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,.6);}
.modal-header{display:flex; align-items:center; justify-content:space-between; padding:1rem 1.2rem; border-bottom:1px solid var(--outline-variant);}
.modal-title{font-family:'Noto Serif',serif; font-size:1.1rem; font-weight:700; color:var(--primary);}
.modal-close{background:transparent; border:none; color:var(--on-surface); font-size:1.5rem; cursor:pointer;}
.modal-body{flex:1; overflow-y:auto; padding:1rem;}

/* 图鉴（新：卡片式天体图鉴） */
.album-hero{display:flex; flex-wrap:wrap; gap:1rem; align-items:flex-end; justify-content:space-between; padding:1.2rem 1.4rem .2rem;}
.album-hero-left{display:flex; flex-direction:column; gap:.35rem; max-width:62%;}
.album-hero-left .h-icon{display:flex; align-items:center; color:var(--primary-fixed-dim);}
.album-hero-left .h-icon .material-symbols-outlined{font-size:1.8rem;}
.album-hero-left h2{font-family:'Noto Serif',serif; font-size:1.7rem; font-weight:700; color:var(--on-surface); margin:0;}
.album-hero-left p{font-size:.8rem; line-height:1.5; color:var(--on-surface-variant); margin:0; max-width:30rem;}
.album-hero-right{display:flex; gap:.7rem;}
.album-stat{padding:1rem 1.3rem; border-radius:16px; background:var(--surface-high); min-width:7rem; position:relative; overflow:hidden;}
.album-stat .s-label{font-size:.6rem; letter-spacing:.18em; text-transform:uppercase; color:var(--outline);}
.album-stat .s-num{font-size:1.7rem; font-weight:700; color:var(--primary-fixed); font-family:'Space Grotesk',sans-serif; margin-top:.15rem;}
.album-stat .s-num small{font-size:.8rem; color:var(--on-surface-variant); font-weight:400;}

.album-toolbar{display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; justify-content:space-between; padding:.6rem 1.4rem;}
.album-filters{display:flex; gap:.5rem; flex-wrap:wrap;}
.album-chip{padding:.45rem 1.1rem; border-radius:999px; border:1px solid var(--outline-variant); background:transparent; color:var(--on-surface-variant); font-size:.8rem; cursor:pointer; transition:.2s; white-space:nowrap;}
.album-chip:hover{border-color:var(--primary); color:var(--primary);}
.album-chip.active{background:rgba(233,196,0,.22); border-color:rgba(233,196,0,.55); color:var(--primary-fixed); box-shadow:0 0 16px rgba(233,196,0,.25);}
.album-sort{display:flex; align-items:center; gap:.4rem; font-size:.8rem; color:var(--on-surface-variant); cursor:pointer; user-select:none; padding:.45rem .9rem; border-radius:999px; border:1px solid var(--outline-variant); transition:.2s;}
.album-sort .material-symbols-outlined{font-size:1.2rem; color:var(--outline);}
.album-sort:hover{border-color:var(--primary);}
.album-sort:hover .material-symbols-outlined{color:var(--primary);}

.album-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:.7rem; padding:1rem 1.4rem;}
@media (max-width:1100px){.album-grid{grid-template-columns:repeat(6,1fr);}}
@media (max-width:760px){.album-grid{grid-template-columns:repeat(4,1fr);}}
@media (max-width:480px){.album-grid{grid-template-columns:repeat(3,1fr);}}
.album-card{position:relative; aspect-ratio:2/3; border-radius:14px; overflow:hidden; cursor:pointer; background:var(--surface-high); box-shadow:0 8px 22px rgba(0,0,0,.4); transition:transform .3s; border:1px solid rgba(255,255,255,.06);}
.album-card:hover{transform:translateY(-8px);}
.album-card .ac-glow{position:absolute; inset:0; opacity:0; transition:opacity .3s; z-index:3; pointer-events:none; box-shadow:0 0 22px rgba(233,196,0,.55);}
.album-card:hover .ac-glow{opacity:1;}
.album-card .ac-bg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--primary-fixed-dim);}
.album-card .ac-bg .silhouette, .album-card .ac-bg .z-sym{width:60%; height:60%; filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
.album-card .ac-grad{position:absolute; left:0; right:0; bottom:0; height:55%; background:linear-gradient(to top,var(--surface-lowest),transparent); z-index:2; display:flex; flex-direction:column; justify-content:flex-end; padding:.55rem;}
.album-card .ac-rarity{font-size:.58rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;}
.album-card .ac-name{font-family:'Noto Serif',serif; font-size:.92rem; font-weight:700; color:var(--on-surface); margin-top:.12rem; line-height:1.15;}
.album-card .ac-elem{position:absolute; top:.5rem; right:.5rem; z-index:4; width:1.6rem; height:1.6rem; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.7rem; background:rgba(10,14,23,.7); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,.2);}
.album-card.unknown{cursor:not-allowed;}
.album-card.unknown .ac-bg{filter:grayscale(1) opacity(.15);}
.album-card.unknown .ac-lock{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:4; color:var(--outline);}
.album-card.unknown .ac-lock .material-symbols-outlined{font-size:2rem; opacity:.4;}
.album-card.unknown .ac-unlock{position:absolute; bottom:.5rem; left:0; right:0; text-align:center; z-index:4; font-size:.58rem; letter-spacing:.15em; text-transform:uppercase; color:var(--outline);}
.ac-r-UR .ac-rarity,.ac-r-UR .ac-elem{color:#ffe16d;}
.ac-r-SSR .ac-rarity,.ac-r-SSR .ac-elem{color:#d7baff;}
.ac-r-SR .ac-rarity,.ac-r-SR .ac-elem{color:#ffb4ab;}
.ac-r-R .ac-rarity,.ac-r-R .ac-elem{color:#ffe16d;}
.ac-r-N .ac-rarity,.ac-r-N .ac-elem{color:#b0bec5;}
.ac-r-METEOR .ac-rarity,.ac-r-METEOR .ac-elem{color:#00e5ff;}

.album-expand{display:flex; justify-content:center; padding:.4rem 1.4rem 1.4rem;}
.album-expand button{display:flex; align-items:center; gap:.4rem; padding:.7rem 1.6rem; border-radius:999px; background:var(--surface-high); color:var(--primary-fixed); font-size:.8rem; letter-spacing:.15em; border:1px solid rgba(233,196,0,.2); cursor:pointer; transition:.2s;}
.album-expand button:hover{background:var(--surface-highest);}

.bond-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:.9rem; padding:1rem 1.4rem 1.6rem;}
.bond-card{position:relative; border-radius:16px; padding:1.1rem; background:var(--surface-high); overflow:hidden; border:1px solid var(--glass-border); display:flex; gap:1rem; align-items:center;}
.bond-card .b-ring{position:relative; width:5rem; height:5rem; flex-shrink:0;}
.bond-card .b-ring svg{width:100%; height:100%; transform:rotate(-90deg);}
.bond-card .b-pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.05rem; font-weight:700; color:var(--on-surface); font-family:'Space Grotesk',sans-serif;}
.bond-card .b-main{flex:1; display:flex; flex-direction:column; gap:.35rem; min-width:0;}
.bond-card .b-title{font-family:'Noto Serif',serif; font-size:1.05rem; font-weight:700; color:var(--primary-fixed); display:flex; align-items:center; gap:.5rem; flex-wrap:wrap;}
.bond-card .b-elem{font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; color:var(--on-surface-variant);}
.bond-card .b-desc{font-size:.72rem; color:var(--on-surface-variant); line-height:1.4;}
.bond-card .b-dots{display:flex; gap:.3rem; flex-wrap:wrap; margin-top:.3rem;}
.bond-card .b-dot{width:1.5rem; height:1.5rem; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.68rem; background:var(--surface-highest); border:1px solid var(--outline-variant); color:var(--outline);}
.bond-card .b-dot.on{background:var(--primary-fixed); color:var(--on-primary); border-color:var(--primary-fixed); box-shadow:0 0 10px rgba(233,196,0,.5);}

/* 详情（新：左图右文） */
.detail-card{position:relative; z-index:2; width:min(92vw,820px); max-height:88vh; display:flex; flex-direction:row; overflow:hidden; border-radius:22px; text-align:left; border:1px solid var(--glass-border); background:var(--surface-container); box-shadow:0 24px 70px rgba(0,0,0,.6);}
.detail-card.rarity-SR{border-color:#d7baff;}
.detail-card.rarity-SSR{border-color:#e9c400; box-shadow:0 0 40px rgba(233,196,0,.3);}
.detail-card.rarity-UR{border-color:#ff80ab; box-shadow:0 0 50px rgba(255,215,0,.5);}
.detail-card.rarity-METEOR{border-color:#00e5ff; box-shadow:0 0 45px rgba(0,229,255,.35);}
.detail-figure{position:relative; width:42%; min-height:360px; background:var(--surface-lowest); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.detail-figure img:not(.card-art){display:none;}
.detail-figure .df-icon{width:56%; height:56%; color:var(--primary-fixed-dim);}
.detail-figure .df-icon .silhouette, .detail-figure .df-icon .z-sym{width:100%; height:100%; filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));}
.detail-figure .df-name{position:absolute; top:1.4rem; left:1.4rem; writing-mode:vertical-rl; text-orientation:upright; font-size:2.4rem; font-family:'Noto Serif',serif; font-weight:700; color:rgba(233,196,0,.22); line-height:.85;}
.detail-body{position:relative; flex:1; padding:1.8rem 2rem; overflow-y:auto;}
.detail-body .d-close{position:absolute; top:1rem; right:1rem; width:2.4rem; height:2.4rem; border-radius:50%; border:none; background:var(--surface-high); color:var(--on-surface-variant); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s;}
.detail-body .d-close:hover{color:var(--primary);}
.detail-tags{display:flex; align-items:center; gap:.5rem; margin-bottom:.4rem;}
.detail-tag-r{font-size:.58rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:.25rem .7rem; border-radius:999px; background:var(--primary-fixed); color:var(--on-primary);}
.detail-sub{font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--primary-fixed-dim);}
.detail-name{font-family:'Noto Serif',serif; font-size:2rem; font-weight:700; color:var(--on-surface); margin:.3rem 0 .6rem;}
.detail-divider{height:1px; background:linear-gradient(to right,var(--primary-fixed-dim),transparent); margin-bottom:1rem;}
.detail-sec{margin-bottom:1.1rem;}
.detail-sec h4{font-size:.62rem; letter-spacing:.15em; text-transform:uppercase; color:var(--outline); margin:0 0 .45rem;}
.detail-sec p{font-size:.85rem; line-height:1.6; color:var(--on-surface-variant); margin:0;}
.detail-skill{background:var(--surface-low); border:1px solid var(--glass-border); border-radius:14px; padding:.9rem 1rem;}
.detail-skill .ds-head{display:flex; align-items:center; gap:.6rem; margin-bottom:.5rem;}
.detail-skill .ds-ico{width:2.2rem; height:2.2rem; border-radius:50%; background:var(--surface-high); display:flex; align-items:center; justify-content:center; color:var(--primary-fixed);}
.detail-skill .ds-name{font-size:.95rem; font-weight:700; color:var(--on-surface);}
.detail-skill .ds-type{font-size:.62rem; color:var(--on-surface-variant);}
.detail-skill .ds-desc{font-size:.8rem; line-height:1.5; color:var(--on-surface-variant); padding-left:2.8rem;}
.detail-actions{display:flex; gap:.8rem; margin-top:1.4rem;}
.detail-actions .da-primary{flex:1; padding:1rem; border-radius:14px; border:none; background:var(--primary-fixed); color:var(--on-primary); font-weight:700; letter-spacing:.1em; cursor:pointer; font-size:.8rem; text-transform:uppercase; transition:.2s;}
.detail-actions .da-primary:hover{transform:scale(1.02);}
.detail-actions .da-ghost{padding:1rem 1.4rem; border-radius:14px; border:1px solid var(--outline-variant); background:transparent; color:var(--on-surface-variant); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s;}
.detail-actions .da-ghost:hover{border-color:var(--primary); color:var(--primary);}
@media (max-width:640px){.detail-card{flex-direction:column;} .detail-figure{width:100%; min-height:220px;} .album-hero-left{max-width:100%;}}

/* 图片卡（自定义卡面，如奎木狼） */
.card-art{display:block;}
.album-card .ac-bg .card-art{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.album-card.has-img .ac-grad{display:none;}
.flip-card.has-img .fc-front{padding:0; background:transparent; border-color:transparent;}
.flip-card.has-img .fc-art{position:absolute; inset:0; background-size:cover; background-position:center;}
.flip-card.has-img .fc-art::after{content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(10,14,23,.92) 0%, rgba(10,14,23,.15) 42%, rgba(10,14,23,0) 70%);}
.flip-card.has-img .fc-rarity, .flip-card.has-img .fc-name{position:absolute; left:0; right:0; z-index:2; text-align:center;}
.flip-card.has-img .fc-rarity{bottom:2.3rem; font-size:.62rem; letter-spacing:.18em; color:var(--primary-fixed); text-shadow:0 1px 4px rgba(0,0,0,.6);}
.flip-card.has-img .fc-name{bottom:.9rem; font-family:'Noto Serif',serif; font-weight:700; font-size:clamp(.95rem,4vw,1.2rem); color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.7);}
.flip-card.has-img .fc-title, .flip-card.has-img .fc-group{display:none;}
.detail-figure .df-icon .card-art{width:100%; height:100%; object-fit:contain;}
.detail-card.has-img .detail-figure .df-icon{width:100%; height:100%;}
.detail-card.has-img .df-name{display:none;}

/* 统计 + 弹窗底部 */
.modal-footer{display:flex; justify-content:center; padding:.5rem 1.4rem 1.2rem;}
.reset-btn{display:flex; align-items:center; gap:.4rem; padding:.7rem 1.4rem; border-radius:999px;
  border:1px solid rgba(255,180,171,.35); background:transparent; color:var(--error);
  font-size:.82rem; font-weight:500; cursor:pointer; transition:.2s;}
.reset-btn:hover{background:rgba(255,180,171,.1);}
.reset-btn .material-symbols-outlined{font-size:1.1rem;}
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:.7rem;}
.stat-card{padding:.9rem; border-radius:14px; background:var(--surface-high); border:1px solid var(--glass-border); text-align:center;}
.stat-label{font-size:.72rem; color:var(--on-surface-variant); letter-spacing:.08em;}
.stat-num{font-size:1.4rem; font-weight:700; color:var(--primary-fixed); font-family:'Space Grotesk',sans-serif;}

/* toast */
.toast{position:fixed; left:50%; bottom:6rem; transform:translateX(-50%) translateY(20px); z-index:200;
  padding:.7rem 1.4rem; border-radius:999px; background:rgba(49,53,63,.95); color:var(--on-surface); font-size:.85rem;
  opacity:0; pointer-events:none; transition:.3s; border:1px solid var(--glass-border);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (max-width:480px){
  .album-grid{grid-template-columns:repeat(3,1fr);}
  .pull-btns{gap:.6rem;}
  .pull-btn .lbl{font-size:1.05rem;}
}
</style>
</head>
<body>
  <div class="bg-img"></div>
  <div class="bg-overlay"></div>
  <div id="stars"></div>

  <!-- 顶栏（移动端：标题居中 + 返回 + 图鉴 + 统计） -->
  <header class="topbar">
    <button class="top-back" id="backBtn" title="返回"><span class="material-symbols-outlined">arrow_back</span></button>

/* ===================== 状态存储 ===================== */
const STORAGE_KEY = 'summer_gacha_v1';
let state = loadState();
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { draws:0, owned:{}, rarityCount:{N:0,R:0,SR:0,SSR:0,UR:0,METEOR:0} };
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }

/* ===================== 星轨结晶（跨页面共享货币） =====================
   与「海上丝路」共用同一个 localStorage 键（同域 iframe 共享），
   每日默认 +20000，抽卡消耗，丝路得分可领取。 */
const CRYSTAL_KEY = 'summer_crystal_v1';
const DAILY_CRYSTAL = 20000;
function _cToday(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function _cGet(){ try{ const r=localStorage.getItem(CRYSTAL_KEY); if(r) return JSON.parse(r); }catch(e){} return {balance:0, lastDaily:null}; }
function _cSave(s){ try{ localStorage.setItem(CRYSTAL_KEY, JSON.stringify(s)); }catch(e){} }
function ensureDailyCrystal(){
  const s=_cGet(); const t=_cToday();
  if (s.lastDaily !== t) {
    let days = 1;
    if (s.lastDaily) { const a=new Date(s.lastDaily+'T00:00:00'), b=new Date(t+'T00:00:00'); days = Math.max(1, Math.round((b-a)/86400000)); }
    s.balance = (s.balance||0) + DAILY_CRYSTAL * days;
    s.lastDaily = t; _cSave(s);
  }
  return s.balance;
}
function getCrystal(){ ensureDailyCrystal(); return _cGet().balance; }
function addCrystal(n){ const s=_cGet(); s.balance = (s.balance||0) + n; _cSave(s); return s.balance; }
function spendCrystal(n){ const s=_cGet(); if ((s.balance||0) < n) return false; s.balance -= n; _cSave(s); return true; }

function ownCard(card) {
  if (!state.owned[card.id]) state.owned[card.id] = 0;
  state.owned[card.id]++;
  state.rarityCount[card.rarity] = (state.rarityCount[card.rarity] || 0) + 1;
  saveState();
}

/* ===================== 抽卡核心 ===================== */
const rarityKeys = ['N','R','SR','SSR','UR'];
function rollRarity() {
  if (Math.random() < 0.05) return 'METEOR';
  const r = Math.random() * 0.95;
  let acc = 0;
  for (const k of rarityKeys) { acc += RARITY[k].rate; if (r < acc) return k; }
  return 'N';
}
function drawCard() {
  const r = rollRarity();
  if (r === 'METEOR') return POOL.find(c => c.rarity === 'METEOR');
  const pool = POOL.filter(c => c.rarity === r);
  return pool[Math.floor(Math.random() * pool.length)];
}

  return BEAST_SVG[card.group];
}

  return `<div class="fc-icon">${cardIcon(card)}</div>

function renderResultCard(card, big){
  return `<div class="flip-card ${big?'big':''} ${card.img?'has-img':''} rarity-${card.rarity}">
    <div class="fc-inner">
      <div class="fc-back"><span class="material-symbols-outlined">auto_awesome</span></div>
      <div class="fc-front">${cardFace(card)}</div>
    </div>
  </div>`;
}

function showToast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ===================== 动画与抽卡流程 ===================== */
let isDrawing = false;
/* 扭蛋舱已移除：中央改以星云 + 星星点点呈现 */

function playBurst(rarity) {
  const burst = $('#burst');
  burst.className = 'burst';
  void burst.offsetWidth;
  if (rarity === 'SR') burst.classList.add('sr');
  else if (rarity === 'SSR') burst.classList.add('ssr');
  else if (rarity === 'UR') burst.classList.add('ur');
  else if (rarity === 'METEOR') burst.classList.add('meteor');
}

function openResult(html, rarity) {
  const layer = $('#resultLayer');
  const container = $('#resultContainer');
  const backdrop = $('#resultBackdrop');
  container.innerHTML = html;
  backdrop.className = 'result-backdrop rarity-' + rarity;
  layer.classList.add('active');
  if (rarity === 'UR') $('#urBurstId').classList.add('active');
  playBurst(rarity);
  const cards = container.querySelectorAll('.flip-card');
  cards.forEach((c, i) => setTimeout(() => c.classList.add('flipped'), 500 + i * 200));
}

function closeResult() {
  $('#resultLayer').classList.remove('active');
  $('#urBurstId').classList.remove('active');
  $('#burst').className = 'burst';
  updateHeader();
}

function doDrawOnce() {
  if (isDrawing) return;
  if (!spendCrystal(100)) { showToast('星轨结晶不足，单抽需要 100'); updateHeader(); return; }
  isDrawing = true;
  $('#drawOnce').disabled = true; $('#drawTen').disabled = true;
  $('#nebulaCore').classList.add('speed-up');
  setTimeout(() => {
    const card = drawCard();
    ownCard(card); state.draws++; saveState();
    $('#nebulaCore').classList.remove('speed-up');
    openResult(renderResultCard(card, true), card.rarity);
    isDrawing = false;
    $('#drawOnce').disabled = false; $('#drawTen').disabled = false;
    updateHeader();
  }, 1200);
}

function doDrawTen() {
  if (isDrawing) return;
  if (!spendCrystal(1000)) { showToast('星轨结晶不足，十连需要 1000'); updateHeader(); return; }
  isDrawing = true;
  $('#drawOnce').disabled = true; $('#drawTen').disabled = true;
  $('#nebulaCore').classList.add('speed-up');
  setTimeout(() => {
    const cards = [];
    for (let i=0;i<10;i++) cards.push(drawCard());
    cards.forEach(c => ownCard(c));
    state.draws += 10; saveState();
    $('#nebulaCore').classList.remove('speed-up');
    const maxR = cards.reduce((m,c)=> rarityKeys.indexOf(c.rarity) > rarityKeys.indexOf(m) ? c.rarity : m, 'N');
    const html = '<div class="result-grid">' + cards.map(c => renderResultCard(c, false)).join('') + '</div>';
    openResult(html, maxR);
    isDrawing = false;
    $('#drawOnce').disabled = false; $('#drawTen').disabled = false;
    updateHeader();
  }, 1600);
}

/* ===================== 图鉴系统 ===================== */
const RARITY_TIER = { N:'凡星', R:'灵宿', SR:'稀有', SSR:'史诗', UR:'传说', METEOR:'流星' };
const ELEMENT = { qinglong:'木', zhuque:'火', baihu:'金', xuanwu:'水', meteor:'流星' };
const GROUP_SKILL = {
  qinglong:{name:'苍木之息', icon:'eco', desc:'回合开始时，为我方生命值最低的单位恢复等同于攻击力 120% 的生命值，并附加「复苏」状态持续 2 回合。'},
  zhuque:{name:'焚天之炎', icon:'local_fire_department', desc:'对敌方全体造成等同于攻击力 95% 的火属性伤害，并施加「灼烧」状态持续 2 回合。'},
  baihu:{name:'肃金之锋', icon:'shield', desc:'提升我方前排 30% 暴击率，首次受击时反弹 60% 伤害。'},
  xuanwu:{name:'寒水之护', icon:'water_drop', desc:'为全队附加等同于自身生命值 18% 的护盾，并免疫下一次控制效果。'}
};
const ALBUM_FILTERS = [
  {key:'all', label:'全部星宿'},
  {key:'qinglong', label:'东方青龙'},
  {key:'zhuque', label:'南方朱雀'},
  {key:'baihu', label:'西方白虎'},
  {key:'xuanwu', label:'北方玄武'}
];
let albumFilter = 'all';
let albumSort = 'default';      // default | rarityDesc | rarityAsc
let albumOnlyOwned = false;
const SORT_LABELS = {default:'默认', rarityDesc:'稀有度↓', rarityAsc:'稀有度↑'};

function renderAlbumFilters() {
  $('#albumFilters').innerHTML = ALBUM_FILTERS.map(f =>
    `<button class="album-chip ${albumFilter===f.key?'active':''}" data-f="${f.key}">${f.label}</button>`
  ).join('');
  $$('#albumFilters .album-chip').forEach(btn => btn.addEventListener('click', ()=>{
    albumFilter = btn.dataset.f; renderAlbumFilters(); renderAlbumGrid();
  }));
}

function albumCardHTML(c, owned) {
  const ri = RARITY[c.rarity];
  const elem = ELEMENT[c.group] || '·';
  const cls = `album-card ${c.img?'has-img':''} ${owned?'ac-r-'+c.rarity:'unknown'}`;
  if (!owned) {
    return `<div class="${cls}" data-id="${c.id}">
      <div class="ac-bg">${cardIcon(c)}</div>
      <div class="ac-lock"><span class="material-symbols-outlined">lock</span></div>
      <div class="ac-unlock">未解锁</div>
    </div>`;
  }
  return `<div class="${cls}" data-id="${c.id}">
    <div class="ac-glow"></div>
    <div class="ac-bg">${cardIcon(c)}</div>
    <div class="ac-grad">
      <div class="ac-rarity">${ri.key} · ${RARITY_TIER[c.rarity]}</div>
      <div class="ac-name">${c.name}</div>
    </div>
    <div class="ac-elem">${elem}</div>
  </div>`;
}
function renderAlbumGrid() {
  let list = albumFilter === 'all' ? POOL.slice() : POOL.filter(c => c.group === albumFilter);
  if (albumOnlyOwned) list = list.filter(c => state.owned[c.id]);
  if (albumSort === 'rarityDesc') list = list.slice().sort((a,b)=> rarityKeys.indexOf(b.rarity)-rarityKeys.indexOf(a.rarity));
  else if (albumSort === 'rarityAsc') list = list.slice().sort((a,b)=> rarityKeys.indexOf(a.rarity)-rarityKeys.indexOf(b.rarity));
  $('#albumGrid').innerHTML = list.map(c => albumCardHTML(c, !!state.owned[c.id])).join('');
  $$('.album-card').forEach(cell => cell.addEventListener('click', ()=>{
    const card = POOL.find(c=>c.id===cell.dataset.id);
    if (state.owned[card.id]) showDetail(card);
    else showToast('尚未获得该卡牌');
  }));
}

function renderBonds() {
  const groups = ['qinglong','zhuque','baihu','xuanwu'];
  const color = {qinglong:'#66bb6a', zhuque:'#ef5350', baihu:'#ffca28', xuanwu:'#42a5f5'};
  const subE = {qinglong:'风', zhuque:'火', baihu:'金', xuanwu:'水'};
  const R = 45, C = 2*Math.PI*R;
  $('#bondList').innerHTML = groups.map(g => {
    const list = POOL.filter(c => c.group === g);
    const total = list.length;
    const got = list.filter(c => state.owned[c.id]).length;
    const pct = total ? Math.round(got/total*100) : 0;
    const off = C * (1 - got/total);
    const dots = list.map(c => `<div class="b-dot ${state.owned[c.id]?'on':''}" title="${state.owned[c.id]?c.name:'未解锁'}">${ELEMENT[g]}</div>`).join('');
    return `
      <div class="bond-card">
        <div class="b-ring">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="8"></circle>
            <circle cx="50" cy="50" r="${R}" fill="none" stroke="${color[g]}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"></circle>
          </svg>
          <div class="b-pct">${pct}%</div>
        </div>
        <div class="b-main">
          <div class="b-title"><span>${GROUP_INFO[g].name}</span><span class="b-elem">${ELEMENT[g]} / ${subE[g]}</span></div>
          <div class="b-desc">${GROUP_INFO[g].desc}　已收集 ${got}/${total}。</div>
          <div class="b-dots">${dots}</div>
        </div>
      </div>`;
  }).join('');
}

function showDetail(card) {
  const ri = RARITY[card.rarity];
  const sk = GROUP_SKILL[card.group] || {name:'星辉之佑', icon:'auto_awesome', desc:'凝聚星辉，为全队提供稳定的灵力增益。'};
  const subMap = {xiu:'星宿', zodiac:'星座', fusion:'融合典藏', meteor:'特殊'};
  $('#detailCard').className = `detail-card rarity-${card.rarity} ${card.img?'has-img':''}`;
  $('#detailVName').textContent = card.name;
  $('#detailIcon').innerHTML = cardIcon(card);
  $('#detailTagR').textContent = ri.key;
  $('#detailSub').textContent = `${GROUP_INFO[card.group].name} · ${subMap[card.type]||'星宿'}`;
  $('#detailName').textContent = card.name;
  $('#detailDesc').textContent = card.desc;
  $('#detailSkillIco').textContent = sk.icon;
  $('#detailSkillName').textContent = sk.name;
  $('#detailSkillDesc').textContent = sk.desc;
  $('#detailModal').classList.add('active');
}

function updateAlbumProgress() {
  const got = Object.keys(state.owned).length;
  $('#albumProgress').innerHTML = `${got}<small>/${POOL.length}</small>`;
}

function openAlbum() { renderAlbumFilters(); renderAlbumGrid(); renderBonds(); updateAlbumProgress(); $('#albumModal').classList.add('active'); }
function closeAlbum() { $('#albumModal').classList.remove('active'); }

/* ===================== 统计系统 ===================== */
function openStats() {
  const total = POOL.length;
  const got = Object.keys(state.owned).length;
  $('#statGrid').innerHTML = `
    <div class="stat-card"><div class="stat-label">累计抽卡</div><div class="stat-num">${state.draws}</div></div>
    <div class="stat-card"><div class="stat-label">已收集</div><div class="stat-num">${got}/${total}</div></div>
    <div class="stat-card"><div class="stat-label">N 凡星</div><div class="stat-num">${state.rarityCount.N||0}</div></div>
    <div class="stat-card"><div class="stat-label">R 灵宿</div><div class="stat-num">${state.rarityCount.R||0}</div></div>
    <div class="stat-card-note" style="display:none"></div>
    <div class="stat-card"><div class="stat-label">SR 玄星</div><div class="stat-num">${state.rarityCount.SR||0}</div></div>
    <div class="stat-card"><div class="stat-label">SSR 极宿</div><div class="stat-num">${state.rarityCount.SSR||0}</div></div>
    <div class="stat-card"><div class="stat-label">UR 混元</div><div class="stat-num">${state.rarityCount.UR||0}</div></div>
    <div class="stat-card"><div class="stat-label">流星</div><div class="stat-num">${state.rarityCount.METEOR||0}</div></div>
    <div class="stat-card"><div class="stat-label">收集率</div><div class="stat-num">${Math.round(got/total*100)}%</div></div>
  `;
  $('#statsModal').classList.add('active');
}
function closeStats() { $('#statsModal').classList.remove('active'); }

function resetData() {
  if (!confirm('确定要重置所有抽卡数据吗？已收集卡牌与累计次数将全部清空，不可恢复。')) return;
  state = { draws:0, owned:{}, rarityCount:{N:0,R:0,SR:0,SSR:0,UR:0,METEOR:0} };
  saveState(); updateHeader();
  if ($('#albumModal').classList.contains('active')) { renderAlbumGrid(); renderBonds(); updateAlbumProgress(); }
  if ($('#statsModal').classList.contains('active')) openStats();
  showToast('数据已重置');
}

/* ===================== 初始化与事件 ===================== */
function updateHeader() {
  $('#totalDraw').textContent = state.draws;
  const cb = $('#crystalBalance');
  if (cb) cb.textContent = getCrystal().toLocaleString();
}

function initStars() {
  const box = $('#stars');
  for (let i=0;i<60;i++) {
    const s = document.createElement('div'); s.className='star';
    const size = 1 + Math.random()*2.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%; top:${Math.random()*100}%;
      --tx:${(Math.random()-.5)*60}px; --ty:${(Math.random()-.5)*80}px;
      --dur:${4+Math.random()*8}s; --delay:${Math.random()*-10}s; --max:${.3+Math.random()*.7};
    `;
    box.appendChild(s);
  }
}

function init() {
  initStars();
  ensureDailyCrystal();
  updateHeader();
  const back = $('#backBtn');
  if (back) back.addEventListener('click', () => {
    try {
      const p = window.parent;
      if (p && p.document) {
        const app = p.document.getElementById('app');
        if (app) app.classList.remove('capsule-full');   // 退出全屏扭蛋态
        if (p.App && p.App.switchPage) p.App.switchPage('inspire'); // 回到灵感游戏落地页（tab 栏 + 底部导航可见）
      }
    } catch (e) {}
  });
  $('#drawOnce').addEventListener('click', doDrawOnce);
  $('#drawTen').addEventListener('click', doDrawTen);
  $('#albumBtn').addEventListener('click', openAlbum);
  $('#albumClose').addEventListener('click', closeAlbum);
  $('#statsBtn').addEventListener('click', openStats);
  $('#statsClose').addEventListener('click', closeStats);
  $('#resultClose').addEventListener('click', closeResult);
  $('#drawAgain').addEventListener('click', ()=>{ closeResult(); setTimeout(doDrawOnce, 250); });
  $('#resetBtn').addEventListener('click', resetData);
  $('#detailClose').addEventListener('click', ()=>$('#detailModal').classList.remove('active'));
  $('#albumSort').addEventListener('click', ()=>{
    albumSort = albumSort==='default' ? 'rarityDesc' : albumSort==='rarityDesc' ? 'rarityAsc' : 'default';
    $('#albumSort').querySelector('span').textContent = '排序·' + SORT_LABELS[albumSort];
    renderAlbumGrid();
  });
  $('#albumExpand').addEventListener('click', ()=>{
    const btn = $('#albumExpand');
    const span = btn.querySelector('span:last-child');
    albumOnlyOwned = !albumOnlyOwned;
    span.textContent = albumOnlyOwned ? '显示全部' : '展开星图';
    renderAlbumGrid();
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
